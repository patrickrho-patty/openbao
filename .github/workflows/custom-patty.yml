name: Patty Secrets — custom build to registry.patty.io
on:
  push:
    branches: [custom]
  workflow_dispatch:

jobs:
  build:
    # Public repo + public registry: github-hosted runners can push to DOCR.
    # (GARM can't take public-fork jobs; Harbor is tailnet-only.)
    runs-on: [ubuntu-latest]
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/set-up-go
      - uses: actions/setup-node@v4
        with: { node-version-file: ui/package.json }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: ui/package.json }
      - run: make --version && git --version && gcc --version | head -n 1
      - run: make static-dist
      - run: make bin
      - run: mkdir -p bin/amd64 && cp bin/bao bin/amd64/bao && ls -la bin/amd64/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            registry.digitalocean.com/patty-devops/openbao:custom
            registry.digitalocean.com/patty-devops/openbao:${{ github.sha }}
          cache-from: type=registry,ref=registry.digitalocean.com/patty-devops/openbao:buildcache
          cache-to: type=registry,ref=registry.digitalocean.com/patty-devops/openbao:buildcache,mode=max
          platforms: linux/amd64
