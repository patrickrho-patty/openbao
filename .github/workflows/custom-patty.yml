name: Patty Secrets — custom build to registry.patty.io
on:
  push:
    branches: [custom]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, garm, linux, x64]
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/set-up-go
      - uses: actions/setup-node@v4
        with: { node-version-file: ui/package.json }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: ui/package.json }
      - run: pnpm --dir ui install
      - run: sudo apt-get update && sudo apt-get install -y make build-essential git
      - run: make bin
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            registry.patty.io/openbao:custom
            registry.patty.io/openbao:${{ github.sha }}
          cache-from: type=registry,ref=registry.patty.io/openbao:buildcache
          cache-to: type=registry,ref=registry.patty.io/openbao:buildcache,mode=max
          platforms: linux/amd64
